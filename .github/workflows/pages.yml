# Publishes site/ to GitHub Pages.
#
# The dashboard is built locally by `./wk web`, because building it needs your
# Strava and Garmin credentials and those never belong in CI. This workflow
# only takes whatever site/index.html you committed and serves it.
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on for the repo, so there is no
        # settings toggle to remember.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
