# Publishes docs/ to GitHub Pages.
#
# Only runs when Pages is set to "GitHub Actions" in Settings -> Pages. If it
# is set to "Deploy from a branch -> main -> /docs" instead, GitHub serves the
# folder directly and this workflow is simply unused — either source works.
#
# The dashboard is built locally by `./wk web`, because building it needs your
# Strava and Garmin credentials and those never belong in CI. This workflow
# only takes whatever docs/index.html you committed and serves it.
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # No `enablement:` here: creating a Pages site needs permissions the
        # workflow token does not have, so Pages must be switched on once by
        # hand in Settings -> Pages. See README, "Publishing it".
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
